# https://github.com/jenkinsci/configuration-as-code-plugin/blob/master/README.md

jenkins:
  systemMessage: |+
    Jenkins configured automatically by Jenkins Configuration as Code plugin
  
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  
  securityRealm:
    local:
      allowsSignup: false
      users:
      - id: "admin"
        name: "Crappital Admin"
        password: "#jbcrypt:$2a$10$v0/Q/A./0.u.t.e.x.t.0.u.G.B.Z.e.w.G.X.g.Z.L.Z.w.C.h.I"
        properties:
        - mailer:
            emailAddress: "admin@crappital.valid"

tool:
  git:
    installations:
    - name: "Default"
      home: "git"
      properties:
      - installSource: {}
  
  nodejs:
    installations:
    - name: "NodeJS 22"
      properties:
      - installSource:
          installers:
          - nodeJSInstaller:
              id: "22.14.0"
              npmPackagesRefreshHours: 72