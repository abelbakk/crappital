name: crappital

services:
  mongodb:
    image: mongo:8.0.5
    container_name: crappital-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: crappital
      MONGO_INITDB_DATABASE: crappital
    volumes:
      - mongodb_data:/data/db
      - ./db-init/:/docker-entrypoint-initdb.d

volumes:
  mongodb_data:

